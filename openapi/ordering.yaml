openapi: 3.1.0

info:
  title: BookFlow Ordering API - 주문 (초안)
  version: 0.1.0-draft
  description: |
    05단계(주문 등록·목록·상세·확정)에서 **구현된 동작만** 기술한 계약 초안이다.

    **배포 상태: 미배포.** 이 계약을 서빙하는 HTTP 서버·라우터는 아직 없다. 계약은
    도메인 계층(`createOrderApi` + `handle`)의 동작을 기준으로 하며, 그 계층의 응답이 이
    스키마를 만족하는지는 `tests/openapi`의 계약 테스트가 검증한다.

    **기준 문서:** `Docs/05_API_Security/API_명세서_V2.2.md`. 경로 접두어 `/v1/tenants/{tenantId}`는
    그 문서의 "제안 경로"이다.

    **문서에는 있으나 이 초안에서 의도적으로 제외한 것 (미구현):**
    - 고객 스냅샷, 발주 등 다른 엔드포인트. 재고 예약·결제·환급·수령·취소 요청 엔드포인트는 HTTP 서버(`src/http/app.ts`)에
      구현되어 있으나 **이 명세에는 아직 옮기지 않았다**(계약 테스트가 주문 4개 엔드포인트만 검증한다)
    - `HELD` 등 `DRAFT`·`CONFIRMED` 이외의 주문 상태
    - 역할(Owner/Staff)별 응답 필드 제한, 응답 `requestId`

    **요청 제약 중 도메인 계층이 400으로 강제하는 것 (테스트로 확인됨):**
    - `lines`는 객체 배열이어야 한다(누락·비배열·원소가 객체가 아님 → 400)
    - `lines`의 모든 `bookId`는 이 테넌트의 도서 카탈로그에 있어야 한다. 없거나 다른 테넌트의 도서면 400(존재 여부를 구별할 수 없는 같은 오류).
      성공하면 품목에 `bookTitle`·`bookIsbn`·`listPriceKrw` 스냅샷이 저장된다. `unitPriceKrw`는 호출자가 보낸 값 그대로이며 정가와 같을 필요는 없다
    - `lines` 원소는 `bookId`(문자열)·`quantity`·`unitPriceKrw`만 가질 수 있다. 알 수 없는 필드는 저장하지 않고 400
      (오류 메시지에 클라이언트가 보낸 필드 이름은 되돌리지 않는다)
    - `Idempotency-Key`는 비어 있지 않은 문자열이어야 한다(빈 값·누락 → 400)
    - `expectedVersion`은 1 이상의 정수여야 한다(0·소수·문자열·`null` → 400. 409가 아님)
    - 입력이 잘못되어도 **권한 검사가 먼저**다. 인증 없음은 401, 비활성·비멤버는 403

    **HTTP 서버 계층(`src/http`)이 추가로 강제하는 것 (`tests/http/server.test.ts`):**
    - JWT 서명·만료·`aud` 검증(Supabase 액세스 토큰, HS256·RS256·ES256, 알고리즘 혼동 차단). 실패는 모두 같은 401
    - `Idempotency-Key` 헤더 필수·최대 128자, 경로 파라미터가 UUID가 아니면 404
    - 요청 **최상위**의 알 수 없는 필드와 쿼리 파라미터는 400(클라이언트가 보낸 필드 이름은 되돌리지 않는다)
    - 본문은 `application/json` 객체여야 한다(415·400), 본문 상한 초과는 413

    **아직 강제하지 않는 요청 제약:**
    - 이 명세의 요청 스키마(`additionalProperties: false`)와 서버 허용 목록의 자동 대조(수작업으로 맞춤)
    - 역할(Owner/Staff)별 응답 필드 제한, 응답 `requestId` 본문 필드(헤더 `X-Request-Id`만 있음)

    **이 초안에서 제가 정한 값 (문서에 없음, 사용자 확인 필요):**
    성공 본문 `{ data }` 래퍼, 성공 상태 기본 200, 500 `INTERNAL_ERROR`와 오류 `message` 고정 문구,
    목록 정렬(최신순), 표시번호 형식(정수).

    **사용자가 결정한 값:** 오류 본문 `{ error: { code, message } }`, `detail`은 400에만 노출,
    목록 기본 `limit` 20·최대 100(초과는 400 거부), 빈 초안 허용.

tags:
  - name: orders
    description: 주문

security:
  - bearerAuth: []

paths:
  /v1/tenants/{tenantId}/orders:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [orders]
      operationId: listOrders
      summary: 주문 요약 목록
      description: |
        요청자의 활성 membership이 있는 테넌트의 주문만 `(createdAt, id)` 내림차순(최신순)으로 반환한다.
        `nextCursor`가 있으면 그 값을 `cursor`로 넘겨 이어서 조회한다. 마지막 페이지에는 `nextCursor`가 없다.
        요약에는 품목과 개인정보를 넣지 않는다.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: cursor
          in: query
          required: false
          description: 이전 응답의 `nextCursor`. 불투명 문자열이며 해석하지 않는다. 잘못된 값은 400.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 1 이상 100 이하의 정수. 생략하면 20. 범위를 벗어나면 잘라서 반환하지 않고 400.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 주문 요약 페이지
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOrdersResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [orders]
      operationId: createOrder
      summary: 주문 초안 생성
      description: |
        `DRAFT` 상태의 주문을 만든다(내부 UUID, `version` 1). 품목이 0개인 빈 초안도 허용한다.
        같은 `Idempotency-Key`·같은 본문으로 재시도하면 같은 주문을 반환하고 중복 생성하지 않는다.
        같은 키에 다른 본문이면 409 `IDEMPOTENCY_CONFLICT`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: 생성된 `DRAFT` 주문
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenants/{tenantId}/orders/{orderId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/OrderId"
    get:
      tags: [orders]
      operationId: getOrder
      summary: 주문 상세
      description: |
        없는 주문과 **다른 테넌트의 주문 ID는 구별할 수 없는 동일한 404**로 응답한다(존재 비노출).
      responses:
        "200":
          description: 주문 상세(품목 포함)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenants/{tenantId}/orders/{orderId}/confirm:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [orders]
      operationId: confirmOrder
      summary: 주문 확정
      description: |
        `DRAFT` 주문을 `CONFIRMED`로 바꾼다. 같은 트랜잭션 개념으로 `version`을 1 올리고,
        합계(`totalKrw`)를 계산하고, 서점별 표시번호(`displayNumber`)를 발급한다.
        확정 조건: `DRAFT` 상태, 품목 1개 이상, `expectedVersion`이 현재 `version`과 일치.
        같은 `Idempotency-Key`·같은 본문으로 재시도하면 같은 주문·같은 번호를 반환한다.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmOrderRequest"
      responses:
        "200":
          description: 확정된 주문
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/BusinessInvariant"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase access JWT. 테넌트 ID는 선택자일 뿐 인증 근거가 아니며, 매 요청마다 활성 membership을
        재확인한다. 활성 Owner와 Staff 모두 이 엔드포인트를 사용할 수 있다.

  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        요청별 유일한 키. `tenantId + 연산 + 키` 단위로 유일하다. 같은 키에 본문이 달라지면 409.
        본문 비교는 객체 키 순서와 무관하다(배열 순서는 유지).
      schema:
        type: string
        minLength: 1

  schemas:
    OrderStatus:
      type: string
      enum: [DRAFT, CONFIRMED]

    KrwAmount:
      type: string
      description: 금액은 JSON 숫자가 아니라 10진 정수 문자열이다(앞자리 0·음수·소수·공백 불가).
      pattern: "^(0|[1-9][0-9]*)$"
      examples: ["15000"]

    OrderLineInput:
      type: object
      description: |
        **요청**용 품목. `lineId`는 서버가 부여하므로 클라이언트가 보낼 수 없다(보내면 알 수 없는 필드로 400).
      additionalProperties: false
      required: [bookId, quantity, unitPriceKrw]
      properties:
        bookId:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        unitPriceKrw:
          type: string
          description: 요청의 금액은 `KrwAmount` 형식이되 서버가 15자리(`INPUT_LIMITS.maxMoneyDigits`)를 넘으면 400으로 거부한다. 응답의 금액(합계 등)은 이 상한과 무관해 `KrwAmount`를 그대로 쓴다.
          pattern: "^(0|[1-9][0-9]{0,14})$"
          examples: ["15000"]

    OrderLine:
      type: object
      description: |
        **응답**용 품목. `lineId`는 서버가 품목마다 부여하는 UUID이며 확정 후에도 바뀌지 않는다.
        주문 품목과 발주 품목을 N:M으로 연결할 때(06단계) 품목을 식별하는 데 쓴다.
      additionalProperties: false
      required: [lineId, bookId, quantity, unitPriceKrw]
      properties:
        lineId:
          type: string
          format: uuid
        bookId:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPriceKrw:
          $ref: "#/components/schemas/KrwAmount"
        bookTitle:
          type: string
          description: 주문 시점의 도서 제목 스냅샷(BOOK-007). 이후 도서를 수정해도 바뀌지 않는다.
        bookIsbn:
          type: string
          description: 주문 시점의 ISBN 스냅샷(숫자만). ISBN이 없는 도서에는 없다.
        listPriceKrw:
          $ref: "#/components/schemas/KrwAmount"

    CreateOrderRequest:
      type: object
      description: |
        계약상 명시되지 않은 필드는 400이어야 하나(API V2.2) 요청 파싱 계층이 없어 **현재 구현은 강제하지 않는다**.
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          type: array
          description: 품목 0개(빈 초안)도 허용한다. 확정할 때 최소 1품목이 필요하다.
          items:
            $ref: "#/components/schemas/OrderLineInput"

    ConfirmOrderRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: 확정 대상 주문의 현재 `version`. 다르면 409 `VERSION_CONFLICT`.

    Order:
      type: object
      description: |
        `tenantId`는 포함하지 않는다(요청 경로에 이미 있고 응답 최소화). `displayNumber`와 `totalKrw`는
        확정된 주문에만 있다.
      additionalProperties: false
      required: [id, status, version, createdAt, lines]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/OrderStatus"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        displayNumber:
          type: integer
          description: 서점별 표시번호. 확정 시 발급, 재사용 금지, 결번 허용(DEC-13).
        totalKrw:
          $ref: "#/components/schemas/KrwAmount"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"

    OrderSummary:
      type: object
      additionalProperties: false
      required: [id, status, version]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/OrderStatus"
        version:
          type: integer
          minimum: 1
        displayNumber:
          type: integer
        totalKrw:
          $ref: "#/components/schemas/KrwAmount"

    OrderResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Order"

    ListOrdersResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/OrderSummary"
            nextCursor:
              type: string
              description: 남은 항목이 있을 때만 존재한다.

    ErrorBody:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - IDEMPOTENCY_CONFLICT
                - VERSION_CONFLICT
                - BUSINESS_INVARIANT
                - INTERNAL_ERROR
                - METHOD_NOT_ALLOWED
                - UNSUPPORTED_MEDIA_TYPE
                - PAYLOAD_TOO_LARGE
            message:
              type: string
              description: |
                400 `VALIDATION_ERROR`에서만 문제가 된 입력을 설명하는 문구이고, 그 외 코드는 코드별 고정 문구이다.
                내부 원본 오류 메시지는 어떤 경우에도 포함하지 않는다.

  responses:
    ValidationError:
      description: 입력 검증 실패 (`limit`·`cursor`·`status`·`quantity`·`unitPriceKrw`·`expectedVersion` 등)
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorBody"
              - properties:
                  error:
                    properties:
                      code:
                        const: VALIDATION_ERROR
    Unauthenticated:
      description: 인증 없음
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorBody"
              - properties:
                  error:
                    properties:
                      code:
                        const: UNAUTHENTICATED
    Forbidden:
      description: |
        비멤버, 다른 테넌트 멤버, 존재하지 않는 테넌트, 비활성 멤버. **서로 구별할 수 없는 동일한 응답**이다.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorBody"
              - properties:
                  error:
                    properties:
                      code:
                        const: FORBIDDEN
    NotFound:
      description: 없는 주문, 또는 다른 테넌트의 주문(구별 불가)
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorBody"
              - properties:
                  error:
                    properties:
                      code:
                        const: NOT_FOUND
    IdempotencyConflict:
      description: 같은 `Idempotency-Key`에 다른 본문
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorBody"
              - properties:
                  error:
                    properties:
                      code:
                        const: IDEMPOTENCY_CONFLICT
    Conflict:
      description: 같은 키·다른 본문(`IDEMPOTENCY_CONFLICT`) 또는 `expectedVersion` 불일치(`VERSION_CONFLICT`)
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorBody"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [IDEMPOTENCY_CONFLICT, VERSION_CONFLICT]
    BusinessInvariant:
      description: 업무 규칙 위반 (이미 확정된 주문, 품목 없는 확정)
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorBody"
              - properties:
                  error:
                    properties:
                      code:
                        const: BUSINESS_INVARIANT
    MethodNotAllowed:
      description: 이 경로가 지원하지 않는 메서드. `Allow` 헤더에 지원하는 메서드가 있다.
      headers:
        Allow:
          description: 이 경로가 지원하는 메서드(쉼표 구분)
          schema:
            type: string
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorBody"
              - properties:
                  error:
                    properties:
                      code:
                        const: METHOD_NOT_ALLOWED
    PayloadTooLarge:
      description: 요청 본문이 서버의 상한(기본 1 MiB, `MAX_BODY_BYTES`)을 넘음. 본문을 읽는 단계에서 나오므로 인증·경로 확인보다 앞서며, 토큰이 없거나 경로가 없어도 같은 응답이다.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorBody"
              - properties:
                  error:
                    properties:
                      code:
                        const: PAYLOAD_TOO_LARGE
    UnsupportedMediaType:
      description: 본문의 `Content-Type`이 `application/json`이 아님
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorBody"
              - properties:
                  error:
                    properties:
                      code:
                        const: UNSUPPORTED_MEDIA_TYPE
    InternalError:
      description: 예상하지 못한 서버 오류. 원인은 응답에 없고 서버 로그(`onUnexpectedError` 훅)에만 남는다.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorBody"
              - properties:
                  error:
                    properties:
                      code:
                        const: INTERNAL_ERROR
