      required: [id, status, version, createdAt, lines]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, CONFIRMED] }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        displayNumber: { type: integer }
        totalKrw: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
        heldAt: { type: string, format: date-time }
        holdReason: { type: string }
        discardedAt: { type: string, format: date-time }
        discardReason: { type: string }
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [lineId, bookId, quantity, unitPriceKrw]
            properties:
              lineId: { type: string, format: uuid }
              bookId: { type: string }
              quantity: { type: integer, minimum: 1 }
              unitPriceKrw: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
