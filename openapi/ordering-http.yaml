  /v1/tenants/{tenantId}/store/settings:
    parameters:
      - $ref: "ordering.yaml#/components/parameters/TenantId"
    post:
      tags: [staffAdmin]
      operationId: updateStoreSettings
      summary: 서점 설정 변경 (S-01·S-07)
      description: |
        **Owner만** 서점 이름(1~60자)과 장기 미수령 경고일(1~365일 정수)을 바꾼다(보낸 항목만, 하나 이상). 바뀌는 항목이 없으면 422,
        같은 소유자의 다른 서점 이름과 겹치면(대소문자 무시) 422다(다른 소유자의 서점 이름과는 겹쳐도 된다). 응답은 바뀐 항목의 전·후 값이며
        모든 변경은 추가 전용 이력에 남는다. 경고일은 장기 미수령 경고(`GET /long-unreceived-warnings`)와 대시보드가 기준일을 따로 보내지 않을 때 쓰는 기본값이다.
        담당자는 인증된 사용자로 기록되며 본문으로 보낼 수 없다.
      parameters:
