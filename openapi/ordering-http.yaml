        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [receiving]
      operationId: reallocateAllocation
      summary: reallocateAllocation
      parameters:
        - $ref: "ordering.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [toOrderId, toOrderLineId, quantity, reason, actedAt]
              properties:
                toOrderId: { type: string, format: uuid }
                toOrderLineId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1 }
                actedAt: { type: string, format: date-time }
      responses:
        "201":
          description: 성공(`data`는 도메인 객체)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [release, allocation]
                    properties:
                      release: { $ref: "#/components/schemas/AllocationRelease" }
                      allocation: { $ref: "#/components/schemas/ReceiptAllocation" }
        "400":
          $ref: "ordering.yaml#/components/responses/ValidationError"
        "401":
          $ref: "ordering.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "ordering.yaml#/components/responses/Forbidden"
        "404":
          $ref: "ordering.yaml#/components/responses/NotFound"
        "409":
          $ref: "ordering.yaml#/components/responses/Conflict"
        "422":
          $ref: "ordering.yaml#/components/responses/BusinessInvariant"
        "413":
          $ref: "ordering.yaml#/components/responses/PayloadTooLarge"
        "415":
          $ref: "ordering.yaml#/components/responses/UnsupportedMediaType"
        "405":
          $ref: "ordering.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "ordering.yaml#/components/responses/InternalError"
  /v1/tenants/{tenantId}/allocations/{allocationId}/releases:
    parameters:
      - $ref: "ordering.yaml#/components/parameters/TenantId"
      - name: allocationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [receiving]
      operationId: releaseAllocation
      summary: releaseAllocation
      parameters:
        - $ref: "ordering.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quantity, reason, releasedAt]
              properties:
                quantity: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1 }
                releasedAt: { type: string, format: date-time }
      responses:
        "201":
          description: 성공(`data`는 도메인 객체)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AllocationRelease" }
        "400":
          $ref: "ordering.yaml#/components/responses/ValidationError"
        "401":
          $ref: "ordering.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "ordering.yaml#/components/responses/Forbidden"
        "404":
          $ref: "ordering.yaml#/components/responses/NotFound"
        "409":
          $ref: "ordering.yaml#/components/responses/Conflict"
        "422":
          $ref: "ordering.yaml#/components/responses/BusinessInvariant"
        "413":
          $ref: "ordering.yaml#/components/responses/PayloadTooLarge"
        "415":
          $ref: "ordering.yaml#/components/responses/UnsupportedMediaType"
        "405":
          $ref: "ordering.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "ordering.yaml#/components/responses/InternalError"
  /v1/tenants/{tenantId}/refund-requests/{requestId}/decision:
    parameters:
      - $ref: "ordering.yaml#/components/parameters/TenantId"
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [payments]
      operationId: decideRefundRequest
      summary: decideRefundRequest
      parameters:
        - $ref: "ordering.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, decidedAt]
              properties:
                decision: { type: string, enum: [APPROVED, REJECTED, WITHDRAWN] }
                decidedAt: { type: string, format: date-time }
      responses:
        "200":
          description: 성공(`data`는 도메인 객체)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [decision]
                    properties:
                      decision: { $ref: "#/components/schemas/RefundRequestDecision" }
                      refund: { $ref: "#/components/schemas/RefundConfirmation" }
        "400":
          $ref: "ordering.yaml#/components/responses/ValidationError"
        "401":
          $ref: "ordering.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "ordering.yaml#/components/responses/Forbidden"
        "404":
          $ref: "ordering.yaml#/components/responses/NotFound"
        "409":
          $ref: "ordering.yaml#/components/responses/Conflict"
        "422":
          $ref: "ordering.yaml#/components/responses/BusinessInvariant"
        "413":
          $ref: "ordering.yaml#/components/responses/PayloadTooLarge"
        "415":
          $ref: "ordering.yaml#/components/responses/UnsupportedMediaType"
        "405":
          $ref: "ordering.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "ordering.yaml#/components/responses/InternalError"
  /v1/tenants/{tenantId}/orders/{orderId}/hold:
    parameters:
      - $ref: "ordering.yaml#/components/parameters/TenantId"
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [orders]
      operationId: holdOrder
      summary: 초안 보류 (ST-O02)
      description: |
        `DRAFT` 초안을 보류한다. 상태는 `DRAFT` 그대로이고 `heldAt`·`holdReason`이 채워진다(`version`+1). 보류 중인 초안은 확정할 수 없다(확정 전 조달 금지).
        확정된 주문·이미 보류 중인 초안·폐기된 초안은 422 `BUSINESS_INVARIANT`. 담당자는 토큰에서 도출한다.
      parameters:
        - $ref: "ordering.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, reason, heldAt]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1 }
                heldAt: { type: string, format: date-time }
      responses:
        "200":
          description: 성공(`data`는 주문)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/OrderRecord" }
        "400":
          $ref: "ordering.yaml#/components/responses/ValidationError"
        "401":
          $ref: "ordering.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "ordering.yaml#/components/responses/Forbidden"
        "404":
          $ref: "ordering.yaml#/components/responses/NotFound"
        "409":
          $ref: "ordering.yaml#/components/responses/Conflict"
        "422":
          $ref: "ordering.yaml#/components/responses/BusinessInvariant"
        "413":
          $ref: "ordering.yaml#/components/responses/PayloadTooLarge"
        "415":
          $ref: "ordering.yaml#/components/responses/UnsupportedMediaType"
        "405":
          $ref: "ordering.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "ordering.yaml#/components/responses/InternalError"
  /v1/tenants/{tenantId}/orders/{orderId}/resume:
    parameters:
      - $ref: "ordering.yaml#/components/parameters/TenantId"
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [orders]
      operationId: resumeOrder
      summary: 보류 재개 (ST-O02)
      description: |
        보류 중인 초안을 재개한다. `heldAt`·`holdReason`이 지워지고 `version`+1이 된다. 보류 중이 아닌 주문은 422 `BUSINESS_INVARIANT`.
        보류·재개 이력은 감사 로그에 남는다.
      parameters:
        - $ref: "ordering.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, resumedAt]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                resumedAt: { type: string, format: date-time }
      responses:
        "200":
          description: 성공(`data`는 주문)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/OrderRecord" }
        "400":
          $ref: "ordering.yaml#/components/responses/ValidationError"
        "401":
          $ref: "ordering.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "ordering.yaml#/components/responses/Forbidden"
        "404":
          $ref: "ordering.yaml#/components/responses/NotFound"
        "409":
          $ref: "ordering.yaml#/components/responses/Conflict"
        "422":
          $ref: "ordering.yaml#/components/responses/BusinessInvariant"
        "413":
          $ref: "ordering.yaml#/components/responses/PayloadTooLarge"
        "415":
          $ref: "ordering.yaml#/components/responses/UnsupportedMediaType"
        "405":
          $ref: "ordering.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "ordering.yaml#/components/responses/InternalError"
  /v1/tenants/{tenantId}/orders/{orderId}/discard:
    parameters:
      - $ref: "ordering.yaml#/components/parameters/TenantId"
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [orders]
      operationId: discardOrder
      summary: 초안 폐기 (ST-O09)
      description: |
        외부 거래가 없는 `DRAFT` 초안(보류 중이어도)을 폐기한다. 상태는 `DRAFT` 그대로이고 `discardedAt`·`discardReason`이 채워지며(`version`+1) 품목 등 이력은 보존된다.
        폐기는 되돌릴 수 없다: 이후 보류·재개·확정·재폐기는 422 `BUSINESS_INVARIANT`. 확정된 주문은 폐기할 수 없다.
      parameters:
        - $ref: "ordering.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, reason, discardedAt]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1 }
                discardedAt: { type: string, format: date-time }
      responses:
        "200":
          description: 성공(`data`는 주문)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/OrderRecord" }
        "400":
          $ref: "ordering.yaml#/components/responses/ValidationError"
        "401":
          $ref: "ordering.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "ordering.yaml#/components/responses/Forbidden"
        "404":
          $ref: "ordering.yaml#/components/responses/NotFound"
        "409":
          $ref: "ordering.yaml#/components/responses/Conflict"
        "422":
          $ref: "ordering.yaml#/components/responses/BusinessInvariant"
        "413":
          $ref: "ordering.yaml#/components/responses/PayloadTooLarge"
        "415":
          $ref: "ordering.yaml#/components/responses/UnsupportedMediaType"
        "405":
          $ref: "ordering.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "ordering.yaml#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SupplierOverviewItem:
      type: object
      additionalProperties: false
      required: [code, active, purchaseOrders, openRemainingQuantity, delayedLines, delayedQuantity]
      properties:
        code: { type: string }
        name: { type: string }
        active: { type: boolean }
        orderChannel: { type: string }
        purchaseOrders:
          type: object
          additionalProperties: false
          required: [draft, ready, sent, acknowledged, cancelled, closed]
          properties:
            draft: { type: integer, minimum: 0 }
            ready: { type: integer, minimum: 0 }
            sent: { type: integer, minimum: 0 }
            acknowledged: { type: integer, minimum: 0 }
            cancelled: { type: integer, minimum: 0 }
            closed: { type: integer, minimum: 0 }
        openRemainingQuantity: { type: integer, minimum: 0 }
        delayedLines: { type: integer, minimum: 0 }
        delayedQuantity: { type: integer, minimum: 0 }
        lastDeliveredAt: { type: string, format: date-time, description: 이 공급처에 마지막으로 발주를 전달한 시각. 전달한 적이 없으면 없다 }
    StoreInfo:
      type: object
      additionalProperties: false
      required: [id, name, status, createdAt, longUnreceivedWarningDays, myRole]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [ACTIVE] }
        createdAt: { type: string, format: date-time }
        longUnreceivedWarningDays: { type: integer, minimum: 1, maximum: 365 }
        myRole: { type: string, enum: [OWNER, STAFF] }
    StoreSettingsChange:
      type: object
      additionalProperties: false
      required: [id, tenantId, changes, changedBy, changedAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        changes:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            name:
              type: object
              additionalProperties: false
              required: [from, to]
              properties: { from: { type: string }, to: { type: string } }
            longUnreceivedWarningDays:
              type: object
              additionalProperties: false
              required: [from, to]
              properties: { from: { type: integer }, to: { type: integer } }
        changedBy: { type: string }
        changedAt: { type: string, format: date-time }
    ExceptionItem:
      type: object
      additionalProperties: false
      required: [type, refId, occurredAt]
      properties:
        type: { type: string, enum: [EXCESS_RECEIPT, UNCONFIRMED_PAYMENT, REFUND_REQUIRED, FAILED_NOTIFICATION, PO_CANCELLATION_UNANSWERED] }
        refId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        orderId: { type: string, format: uuid }
        orderDisplayNumber: { type: integer }
        quantity: { type: integer, minimum: 0 }
        amountKrw: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
    DelegationChange:
      type: object
      additionalProperties: false
      required: [id, tenantId, userId, kind, delegated, changedBy, changedAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        kind: { type: string, enum: [MANAGEMENT, STOCK_ADJUSTMENT] }
        delegated: { type: boolean }
        changedBy: { type: string }
        changedAt: { type: string, format: date-time }
    DelegationView:
      type: object
      additionalProperties: false
      required: [userId, kind, delegatedBy, delegatedAt]
      properties:
        userId: { type: string, format: uuid }
        kind: { type: string, enum: [MANAGEMENT, STOCK_ADJUSTMENT] }
        delegatedBy: { type: string }
        delegatedAt: { type: string, format: date-time }
    AllocationCancellationItem:
      type: object
      additionalProperties: false
      required: [id, receiptId, orderId, orderLineId, bookKey, quantity, cancelledAt, pendingDispositionQuantity, stockTransferredQuantity, returnHeldQuantity, returnDispatchedQuantity, returnedFinalQuantity]
      properties:
        id: { type: string, format: uuid }
        receiptId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderLineId: { type: string, format: uuid }
        bookKey: { type: string }
        quantity: { type: integer, minimum: 1 }
        cancelledAt: { type: string, format: date-time }
        pendingDispositionQuantity: { type: integer, minimum: 0 }
        stockTransferredQuantity: { type: integer, minimum: 0 }
        returnHeldQuantity: { type: integer, minimum: 0 }
        returnDispatchedQuantity: { type: integer, minimum: 0 }
        returnedFinalQuantity: { type: integer, minimum: 0 }
    RefundTaskItem:
      type: object
      additionalProperties: false
      required: [id, orderId, requiredKrw, refundedKrw, remainingKrw, status, openedAt, pendingRequests, unresolvedAttempts]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderDisplayNumber: { type: integer }
        requiredKrw: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
        refundedKrw: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
        remainingKrw: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
        status: { type: string, enum: [REFUND_REQUIRED, PARTIAL, REFUNDED] }
        openedAt: { type: string, format: date-time }
        pendingRequests: { type: integer, minimum: 0 }
        unresolvedAttempts: { type: integer, minimum: 0 }
    OrderSettlement:
      type: object
      additionalProperties: false
      required: [orderId, totalKrw, confirmedKrw, pendingKrw, balanceKrw, refundRequiredKrw, orderedQuantity, deliveredQuantity, remainingQuantity]
      properties:
        orderId: { type: string, format: uuid }
        displayNumber: { type: integer }
        totalKrw: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
        confirmedKrw: { type: string, pattern: "^(0|[1-9][0-9]*)$", description: 확인된 거래 − 확인된 환급 − 보정 }
        pendingKrw: { type: string, pattern: "^(0|[1-9][0-9]*)$", description: 입력됐지만 확인도 무효도 아닌 거래 합계 }
        balanceKrw: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
        refundRequiredKrw: { type: string, pattern: "^(0|[1-9][0-9]*)$", description: 확인 금액이 총액을 넘는 과수납분 }
        orderedQuantity: { type: integer, minimum: 0 }
        deliveredQuantity: { type: integer, minimum: 0 }
        remainingQuantity: { type: integer, minimum: 0 }
    NotificationQueueItem:
      type: object
      additionalProperties: false
      required: [id, orderId, mode, securedTotal, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderDisplayNumber: { type: integer, description: 확정 주문의 서점별 표시번호 }
        mode: { type: string, enum: [FULL, PARTIAL] }
        securedTotal: { type: integer, minimum: 0, description: 안내 시점에 확보된 수량 합계 }
        status: { type: string, enum: [PENDING, ATTEMPTED, MANUAL_RECORDED, FAILED] }
        createdAt: { type: string, format: date-time }
        renoticeOfTargetId: { type: string, format: uuid, description: 재안내면 원 대상 }
        attemptedAt: { type: string, format: date-time }
        channel: { type: string, enum: [PHONE, SMS, MESSENGER, VISIT, OTHER] }
        resultAt: { type: string, format: date-time }
        resultOutcome: { type: string, enum: [MANUAL_RECORDED, FAILED] }
    ReceiptCore:
      type: object
      required: [id, purchaseOrderId, poLineId, bookKey, receivedAt, normalQuantity, correctedQuantity, damagedQuantity, misdeliveredQuantity, excessQuantity, allocatedQuantity, unallocatedQuantity]
      properties:
        id: { type: string, format: uuid }
        purchaseOrderId: { type: string, format: uuid }
        poLineId: { type: string, format: uuid }
        bookKey: { type: string }
        receivedAt: { type: string, format: date-time }
        normalQuantity: { type: integer, minimum: 0, description: 검수 등록 정상 수량 }
        correctedQuantity: { type: integer, minimum: 0, description: 검수 정정 합계 }
        damagedQuantity: { type: integer, minimum: 0 }
        misdeliveredQuantity: { type: integer, minimum: 0 }
        excessQuantity: { type: integer, minimum: 0 }
        allocatedQuantity: { type: integer, minimum: 0, description: 배분 − 해제 }
        unallocatedQuantity: { type: integer, description: 순정상 − 배분 + 해제 }
    ReceiptSummary:
      allOf:
        - $ref: "#/components/schemas/ReceiptCore"
      unevaluatedProperties: false
    ReceiptDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/ReceiptCore"
        - type: object
          required: [allocations, corrections, defectResolutions, excessDecisions]
          properties:
            allocations:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, orderId, orderLineId, quantity, releasedQuantity, allocatedAt, allocatedBy]
                properties:
                  id: { type: string, format: uuid }
                  orderId: { type: string, format: uuid }
                  orderLineId: { type: string, format: uuid }
                  quantity: { type: integer, minimum: 1 }
                  releasedQuantity: { type: integer, minimum: 0 }
                  allocatedAt: { type: string, format: date-time }
                  allocatedBy: { type: string }
            corrections:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, quantity, reason, correctedAt, correctedBy]
                properties:
                  id: { type: string, format: uuid }
                  quantity: { type: integer, minimum: 1 }
                  reason: { type: string }
                  correctedAt: { type: string, format: date-time }
                  correctedBy: { type: string }
            defectResolutions:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, kind, quantity, outcome, resolvedAt, resolvedBy]
                properties:
                  id: { type: string, format: uuid }
                  kind: { type: string, enum: [DAMAGED, MISDELIVERED] }
                  quantity: { type: integer, minimum: 1 }
                  outcome: { type: string, enum: [RETURNED_TO_SUPPLIER, SUPPLIER_CREDIT, DISCARDED] }
                  resolvedAt: { type: string, format: date-time }
                  resolvedBy: { type: string }
            excessDecisions:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, decision, quantity, reason, decidedAt, decidedBy]
                properties:
                  id: { type: string, format: uuid }
                  decision: { type: string, enum: [APPROVED, REJECTED] }
                  quantity: { type: integer, minimum: 1 }
                  reason: { type: string }
                  decidedAt: { type: string, format: date-time }
                  decidedBy: { type: string }
    Dashboard:
      type: object
      additionalProperties: false
      required: [orders, purchaseOrders, refunds, dispositions, procurement, receipts, payments, notifications, longUnreceivedWarnings]
      properties:
        orders:
          type: object
          additionalProperties: false
          required: [draft, held, discarded, confirmed]
          properties:
            draft: { type: integer, minimum: 0 }
            held: { type: integer, minimum: 0 }
            discarded: { type: integer, minimum: 0 }
            confirmed: { type: integer, minimum: 0 }
        purchaseOrders:
          type: object
          additionalProperties: false
          required: [draft, ready, sent, acknowledged]
          properties:
            draft: { type: integer, minimum: 0 }
