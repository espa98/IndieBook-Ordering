components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    StockLevel:
      type: object
      required: [bookId, onHand, reserved, available]
      properties:
        bookId: { type: string, format: uuid }
        onHand: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
    Book:
      type: object
      required: [id, tenantId, title, authors, listPriceKrw, source, status, version, createdBy, createdAt, recordedAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        title: { type: string }
        authors: { type: array, items: { type: string } }
        isbn: { type: string }
        listPriceKrw: { type: string }
        source: { type: string, enum: [MANUAL, YES24] }
        externalId: { type: string }
        fetchedAt: { type: string, format: date-time }
        manualReason: { type: string }
        status: { type: string, enum: [ACTIVE] }
        version: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
    BookFields:
      type: object
      required: [title, authors, listPriceKrw]
      properties:
        title: { type: string }
        authors: { type: array, items: { type: string } }
        isbn: { type: string }
        listPriceKrw: { type: string }
    BookRevision:
      type: object
      required: [id, tenantId, bookId, versionBefore, versionAfter, before, after, reason, changedBy, changedAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        versionBefore: { type: integer }
        versionAfter: { type: integer }
        before: { $ref: "#/components/schemas/BookFields" }
        after: { $ref: "#/components/schemas/BookFields" }
        reason: { type: string }
        changedBy: { type: string }
        changedAt: { type: string, format: date-time }
    Supplier:
      type: object
      required: [tenantId, code, active]
      properties:
        tenantId: { type: string, format: uuid }
        code: { type: string }
        active: { type: boolean }
        name: { type: string }
        orderChannel: { type: string, enum: [API, EMAIL, FILE, MESSENGER, PHONE, WEB] }
        version: { type: integer }
    DataResponse:
      type: object
      required: [data]
      properties:
        data: {}
