        활성 멤버(Owner·직원)가 서점의 이름·상태·개설일과 **장기 미수령 경고일**(S-07, DEC-07: 서점별 기본 7일, 자동 취소 없음), 자기 역할을 읽는다.
        비멤버·비활성은 403.
      responses:
