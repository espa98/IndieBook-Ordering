        `status`는 시도·결과 기록에서 파생한다: 시도 없음 `PENDING`, 시도만 `ATTEMPTED`, 마지막 결과가 `MANUAL_RECORDED`(완료) 또는 `FAILED`(재안내 필요).
        메시지 문구와 결과 메모는 싣지 않는다. 커서 페이지네이션(기본 20, 최대 100).
