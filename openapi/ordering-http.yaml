  /v1/tenants/{tenantId}/supplier-overview:
    parameters:
      - $ref: "ordering.yaml#/components/parameters/TenantId"
    get:
      tags: [reads]
      operationId: listSupplierOverview
      summary: 공급처별 발주·입고 현황 (DASH-006)
      description: |
        활성 멤버(Owner·직원)가 서점의 공급처(비활성 포함)를 코드순으로, 발주 상태별 건수(`purchaseOrders`)와 전달된(SENT·ACKNOWLEDGED) 발주 품목의
        잔량(`openRemainingQuantity` = 유효 수량 − 순입고)·지연(`delayedLines`·`delayedQuantity`, 전달한 지 `delayDays`일이 지나도 잔량이 남은 품목)·마지막 전달 시각을 읽는다.
        잔량·지연은 `GET /dashboard`의 같은 카드와 같은 규칙이다(전달 후 경과일 기준, 공급처 회신 ETA는 반영하지 않는다). 공급처 수가 많지 않다고 보고 페이지네이션하지 않는다.
      parameters:
        - name: delayDays
          in: query
          required: false
          description: 지연 기준일(1~365, 기본 7)
          schema: { type: string }
      responses:
        "200":
          description: 성공(`data.items`는 공급처 배열)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/SupplierOverviewItem" } }
        "400":
          $ref: "ordering.yaml#/components/responses/ValidationError"
        "401":
          $ref: "ordering.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "ordering.yaml#/components/responses/Forbidden"
        "405":
          $ref: "ordering.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "ordering.yaml#/components/responses/InternalError"
  /v1/tenants/{tenantId}/exceptions:
    parameters:
      - $ref: "ordering.yaml#/components/parameters/TenantId"
    get:
      tags: [reads]
      operationId: listExceptions
      summary: 예외 업무 큐 (O-01-01)
      description: |
        활성 멤버(Owner·직원)가 아직 해결되지 않은 예외를 최신 발생 순으로 한 목록에서 읽는다. 유형:
        `EXCESS_RECEIPT`(초과 입고, `quantity` = 결정되지 않은 수량), `UNCONFIRMED_PAYMENT`(확인도 무효도 아닌 결제, `amountKrw` = 결제 금액),
        `REFUND_REQUIRED`(환급 업무, `amountKrw` = 남은 환급액), `FAILED_NOTIFICATION`(마지막 결과가 실패이고 재안내가 없는 안내 대상),
        `PO_CANCELLATION_UNANSWERED`(공급처가 아직 다 응답하지 않은 발주 취소 요청, `quantity` = 미응답 수량).
        `refId`는 원인 대상(입고·결제·환급 업무·안내 대상·발주 취소 요청)의 ID이고 `type`으로 거를 수 있다. 대시보드의 같은 건수와 같은 규칙이다.
        **읽기 전용이다. 예외를 임의로 종결하는 경로는 없다**(DEC-16 미승인). 장기 미수령은 `GET /long-unreceived-warnings`가 따로 다룬다. 커서 페이지네이션(기본 20, 최대 100).
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [EXCESS_RECEIPT, UNCONFIRMED_PAYMENT, REFUND_REQUIRED, FAILED_NOTIFICATION, PO_CANCELLATION_UNANSWERED] }
      responses:
        "200":
          description: 성공(`data`는 예외 페이지)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
