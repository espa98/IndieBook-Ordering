      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quantity, reservedAt]
              properties:
                quantity: { type: integer, minimum: 1 }
                reservedAt: { type: string, format: date-time }
      responses:
        "201":
          description: 성공(`data`는 도메인 객체)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/StockReservation" }
        "400":
          $ref: "ordering.yaml#/components/responses/ValidationError"
        "401":
          $ref: "ordering.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "ordering.yaml#/components/responses/Forbidden"
        "404":
          $ref: "ordering.yaml#/components/responses/NotFound"
        "409":
          $ref: "ordering.yaml#/components/responses/Conflict"
        "422":
          $ref: "ordering.yaml#/components/responses/BusinessInvariant"
        "413":
          $ref: "ordering.yaml#/components/responses/PayloadTooLarge"
        "415":
          $ref: "ordering.yaml#/components/responses/UnsupportedMediaType"
        "405":
