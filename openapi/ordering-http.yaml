      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                longUnreceivedWarningDays: { type: integer, minimum: 1, maximum: 365 }
      responses:
        "200":
          description: 성공(`data`는 변경 기록)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/StoreSettingsChange" }
        "400":
          $ref: "ordering.yaml#/components/responses/ValidationError"
        "401":
          $ref: "ordering.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "ordering.yaml#/components/responses/Forbidden"
        "404":
          $ref: "ordering.yaml#/components/responses/NotFound"
        "409":
          $ref: "ordering.yaml#/components/responses/Conflict"
        "422":
          $ref: "ordering.yaml#/components/responses/BusinessInvariant"
        "413":
          $ref: "ordering.yaml#/components/responses/PayloadTooLarge"
        "415":
