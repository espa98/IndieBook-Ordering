              required: [expectedVersion, changes, reason, changedAt]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                changes:
                  type: object
                  minProperties: 1
                  properties:
                    title: { type: string, minLength: 1 }
                    authors: { type: array, items: { type: string } }
                    isbn: { type: string, pattern: '^[-\s]*(?:(?:[0-9][-\s]*){13}|(?:[0-9][-\s]*){9}[0-9X][-\s]*)$' }
                    listPriceKrw: { type: string, pattern: '^[1-9][0-9]{0,14}$' }
                reason: { type: string, minLength: 1 }
                acknowledgeDuplicateOf: { type: string, format: uuid }
                changedAt: { type: string, format: date-time }
      responses:
        "200":
          description: 성공(`data`는 도메인 객체)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Book" }
        "400":
          $ref: "ordering.yaml#/components/responses/ValidationError"
        "401":
          $ref: "ordering.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "ordering.yaml#/components/responses/Forbidden"
        "404":
          $ref: "ordering.yaml#/components/responses/NotFound"
        "409":
          $ref: "ordering.yaml#/components/responses/Conflict"
        "422":
          $ref: "ordering.yaml#/components/responses/BusinessInvariant"
        "413":
          $ref: "ordering.yaml#/components/responses/PayloadTooLarge"
        "415":
          $ref: "ordering.yaml#/components/responses/UnsupportedMediaType"
        "405":
          $ref: "ordering.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "ordering.yaml#/components/responses/InternalError"
  /v1/tenants/{tenantId}/store:
