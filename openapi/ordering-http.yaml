        **Owner만** 직원에게 위임을 주거나 거둔다. `kind`: `MANAGEMENT`(공급처·문구 템플릿 관리), `STOCK_ADJUSTMENT`(재고 조정). 종류별로 독립이다.
        `delegated`로 원하는 상태를 보낸다(`true` 부여, `false` 회수). 이미 그 상태면 422. 대상은 서점의 멤버여야 하고(아니면 404),
        Owner(모든 권한이 있다)나 비활성 직원에게는 줄 수 없다(422). 남은 위임은 비활성 직원에게서도 거둘 수 있다.
        담당자는 인증된 사용자로 기록되며 본문으로 보낼 수 없다. 모든 변경은 추가 전용 이력에 남는다.
