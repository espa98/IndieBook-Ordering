        role: { type: string, enum: [OWNER, STAFF] }
    OrderEvent:
      type: object
      additionalProperties: false
      required: [kind, by, at]
      properties:
        kind: { type: string, enum: [HOLD, RESUME, DISCARD] }
        reason: { type: string, description: 보류·폐기에만 있다 }
        by: { type: string }
        at: { type: string, format: date-time }
    OrderRecord:
      type: object
      description: 보류·재개·폐기 응답의 주문. `ordering.yaml`의 `Order`와 같은 형태다(파일 사이 참조를 검증기가 풀지 못해 여기에 둔다).
