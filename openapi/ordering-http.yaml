  /v1/tenants/{tenantId}/allocation-cancellations:
    parameters:
      - $ref: "ordering.yaml#/components/parameters/TenantId"
    get:
      tags: [reads]
      operationId: listAllocationCancellations
      summary: 취소 물량 처분 현황 (R-01·R-03)
      description: |
        활성 멤버(Owner·직원)가 취소로 풀린 배분 물량을 최근 취소 순으로 읽는다. 취소 물량마다 처분 상태를 원장에서 파생한다:
        `pendingDispositionQuantity`(처분 대기 = 취소 − 편입 − 반품 요청 + 거절 + 회수), `stockTransferredQuantity`(재고 편입),
        `returnHeldQuantity`(반품 보관 = 요청 − 거절 − 출고), `returnDispatchedQuantity`(출고 중 = 출고 − 완료 − 예외 해소),
        `returnedFinalQuantity`(반품 완료 + 최종 반송). 다섯 수량의 합은 `quantity`와 같다.
        `open=true`는 처분이 끝나지 않은(대기·보관·출고가 남은) 물량만 돌려준다. 커서 페이지네이션(기본 20, 최대 100).
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: open
          in: query
          required: false
          description: "`true`·`false` 외의 값은 400"
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: 성공(`data`는 취소 물량 페이지)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/AllocationCancellationItem" } }
                      nextCursor: { type: string }
        "400":
          $ref: "ordering.yaml#/components/responses/ValidationError"
        "401":
          $ref: "ordering.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "ordering.yaml#/components/responses/Forbidden"
        "405":
          $ref: "ordering.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "ordering.yaml#/components/responses/InternalError"
  /v1/tenants/{tenantId}/refund-tasks:
    parameters:
      - $ref: "ordering.yaml#/components/parameters/TenantId"
    get:
      tags: [reads]
      operationId: listRefundTasks
      summary: 환급 필요 업무 목록 (O-09-04)
      description: |
        활성 멤버(Owner·직원)가 서점의 환급 업무를 최신 개시 순으로 읽는다. 상태·잔량은 환급 확인 합계에서 파생한다:
        0이면 `REFUND_REQUIRED`, 남으면 `PARTIAL`, 다 하면 `REFUNDED`(금액은 정수 문자열).
        `pendingRequests`는 결정이 없는 환급 요청 수, `unresolvedAttempts`는 불명확(UNKNOWN) 결과를 보고했지만 해소하지 않은 시도 수(한도를 예약한다).
        `open=true`는 완료되지 않은 업무만, `status`로도 거를 수 있다. 증빙·사유 원문은 싣지 않는다. 커서 페이지네이션(기본 20, 최대 100).
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [REFUND_REQUIRED, PARTIAL, REFUNDED] }
        - name: open
          in: query
          required: false
          description: "`true`·`false` 외의 값은 400"
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: 성공(`data`는 환급 업무 페이지)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/RefundTaskItem" } }
                      nextCursor: { type: string }
        "400":
          $ref: "ordering.yaml#/components/responses/ValidationError"
        "401":
          $ref: "ordering.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "ordering.yaml#/components/responses/Forbidden"
        "405":
          $ref: "ordering.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "ordering.yaml#/components/responses/InternalError"
  /v1/tenants/{tenantId}/order-settlements:
    parameters:
      - $ref: "ordering.yaml#/components/parameters/TenantId"
    get:
      tags: [reads]
      operationId: listOrderSettlements
      summary: 수령·결제 현황 (O-09)
      description: |
        활성 멤버(Owner·직원)가 확정 주문을 최신 접수 순으로, 결제 요약과 수령 수량과 함께 읽는다. 기본은 종결되지 않은 주문만.
        결제 숫자는 주문별 결제 요약과 같은 규칙이다(확인된 거래 − 확인된 환급 − 보정, 무효 제외; 금액은 정수 문자열).
        수령 수량은 `orderedQuantity`(주문 품목 수량 합), `deliveredQuantity`(수령 원장 합, 정정 역거래 포함), `remainingQuantity`(남은 수량).
        `unpaid=true`는 잔액이 남은 주문만, `undelivered=true`는 남은 수량이 있는 주문만, `includeClosed=true`는 종결 주문도 포함한다. 커서 페이지네이션(기본 20, 최대 100).
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: unpaid
          in: query
          required: false
          description: "`true`·`false` 외의 값은 400"
          schema: { type: string, enum: ["true", "false"] }
        - name: undelivered
          in: query
          required: false
          description: "`true`·`false` 외의 값은 400"
          schema: { type: string, enum: ["true", "false"] }
        - name: includeClosed
          in: query
          required: false
          description: "`true`·`false` 외의 값은 400"
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: 성공(`data`는 수령·결제 현황 페이지)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/OrderSettlement" } }
                      nextCursor: { type: string }
        "400":
          $ref: "ordering.yaml#/components/responses/ValidationError"
        "401":
          $ref: "ordering.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "ordering.yaml#/components/responses/Forbidden"
        "405":
          $ref: "ordering.yaml#/components/responses/MethodNotAllowed"
        "500":
          $ref: "ordering.yaml#/components/responses/InternalError"
