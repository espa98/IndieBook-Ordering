<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordering 웹 P0 인터랙티브 와이어프레임</title><style>
:root{font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;color:#172331;background:#f6f8fa;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{height:68px;background:#17324f;color:white;display:flex;align-items:center;padding:0 24px;gap:22px}header strong{font-size:21px}header input{margin-left:auto;width:310px;background:#fff;border:0;padding:11px;border-radius:7px}header .tenant{background:#28577f;padding:10px;border-radius:7px}aside{background:white;border-right:1px solid #d7e0e8;width:230px;min-height:calc(100vh - 68px);padding:20px 12px;flex-shrink:0}aside button{width:100%;border:0;text-align:left;background:none;padding:12px;border-radius:8px;margin-bottom:4px;color:#536273}aside button.active{background:#e9f1f8;color:#17324f;font-weight:700}main{padding:30px 34px;max-width:1260px;width:100%}.layout{display:flex}.head{display:flex;justify-content:space-between;gap:16px;align-items:center}.head h1{margin:0;font-size:25px}.subtitle{color:#536273;margin:6px 0 0}.tag{background:#e9f1f8;color:#28577f;padding:6px 10px;border-radius:20px;font-size:12px}.card{background:#fff;border:1px solid #d7e0e8;border-radius:12px;padding:22px;margin-top:20px;box-shadow:0 2px 8px #17324f08}.card h2{font-size:17px;margin:0 0 18px}.controls{display:flex;gap:10px;flex-wrap:wrap}.controls input,.controls select{border:1px solid #d7e0e8;border-radius:7px;padding:11px;min-width:190px}.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.field label{display:block;font-weight:600;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid #c7d2dd;border-radius:7px;padding:11px}.muted{color:#536273}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.primary{background:#28577f;color:#fff;border:0;border-radius:7px;padding:11px 18px}.secondary{background:#fff;color:#28577f;border:1px solid #a5b7c9;border-radius:7px;padding:11px 18px}.notice{padding:13px 16px;border-radius:8px;background:#fff6e8;border:1px solid #f0d5a7;color:#795000;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}.metric{background:#fff;border:1px solid #d7e0e8;border-radius:11px;padding:18px}.metric b{display:block;font-size:26px;margin-top:10px}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid #e4eaf0;padding:13px;text-align:left}.table th{color:#536273;background:#f8fafc;font-size:12px}.toast{position:fixed;right:20px;bottom:20px;background:#17324f;color:white;padding:14px 20px;border-radius:9px;display:none}.small{font-size:12px}.help{margin-top:18px;color:#536273} @media(max-width:900px){aside{width:160px}.grid{grid-template-columns:repeat(2,1fr)}main{padding:20px}.fieldgrid{grid-template-columns:1fr}header input{display:none}}@media(max-width:620px){aside{width:100%;min-height:0;display:flex;overflow:auto;padding:6px}aside button{white-space:nowrap;width:auto}.layout{flex-direction:column}.grid{grid-template-columns:1fr}header{height:58px;padding:10px}.head{align-items:flex-start;flex-direction:column}}
</style></head><body><header><strong>◧ Ordering</strong><span class="tenant">○○책방 ▾</span><input placeholder="주문번호·고객·ISBN 통합 검색 (시연)"/><span>점주 ▾</span></header><div class="layout"><aside id="nav"></aside><main id="main"></main></div><div class="toast" id="toast"></div><script>
const screens=[{"id": "O-01", "name": "대시보드", "group": "운영 현황", "fields": ["미처리 주문", "발주 대기", "입고 배분", "안내 대기", "수령 대기", "환급 필요"], "actions": ["카드 클릭 → 해당 업무 목록"], "validation": "기간·서점·담당자·경고", "policy": "7일 미수령 경고는 자동 취소가 아님"}, {"id": "O-02", "name": "주문 목록", "group": "주문", "fields": ["주문번호", "고객", "품목", "주문 상태", "확보", "인도", "결제 잔액"], "actions": ["신규 주문", "상세", "필터 초기화"], "validation": "번호·고객·ISBN·기간·상태 검색", "policy": "주문상태와 조달상태는 별도 열"}, {"id": "O-03", "name": "신규 주문", "group": "주문", "fields": ["고객", "도서", "수량", "확정 판매가", "수령방법", "메모"], "actions": ["초안 저장", "주문 확정"], "validation": "필수 입력·서점 일치·중복 확정 방지", "policy": "확정 성공 시 서점별 고유 주문번호; P0 할인·배송비 자동 계산 없음"}, {"id": "O-04", "name": "주문 상세", "group": "주문", "fields": ["헤더(주문번호·고객·상태)", "품목", "확보·인도", "결제", "타임라인"], "actions": ["조달 배정", "변경·취소", "안내", "수령", "결제", "종결 검사"], "validation": "버전 충돌·권한·완료 잠금", "policy": "종결: 전량 인도·잔액 0·필수 후속 업무 해결"}, {"id": "O-06", "name": "발주 현황", "group": "발주", "fields": ["공급처", "발주번호", "작성·전달", "회신", "미입고", "미수락 취소"], "actions": ["발주서 작성", "상세", "회신"], "validation": "출력과 전달 별도 상태", "policy": "고객 취소만으로 공급처 의무 수량 감소시키지 않음"}, {"id": "O-07-02", "name": "고객별 입고 배분", "group": "입고", "fields": ["정상 미배분 수량", "연결 주문", "고객", "미확보량", "배분량"], "actions": ["자동 제안", "배분 확정"], "validation": "동일 발주 연결·중복 배분·취소 주문 차단", "policy": "입고와 배분은 독립 거래; 취소 고객 자동 배분 금지"}, {"id": "O-09-02", "name": "결제 기록", "group": "수령·결제", "fields": ["원주문", "외부 결제수단", "확인 금액", "거래 식별자", "확인 시각", "증빙"], "actions": ["외부 결제 확인 기록"], "validation": "실제 확인 전 완료 금지, 중복·과수납 방지", "policy": "P0 복수 외부 결제 기록 승인; 실제 PG 승인 P2"}, {"id": "O-09-04", "name": "환급 필요 업무", "group": "수령·결제", "fields": ["원결제", "환급 필요·기록액", "외부 환급 일시", "증빙", "승인"], "actions": ["환급 증빙 입력", "점주 승인", "완료 기록"], "validation": "원결제·미환급액·중복 확인", "policy": "P0 외부 환급 완료 결과만 기록, 앱이 실제 환급 실행하지 않음"}, {"id": "R-01", "name": "취소 도서 처분", "group": "반품·정정", "fields": ["취소 귀속량", "실물 위치", "공급처", "처분 대기"], "actions": ["반품 선택", "재고 편입 요청"], "validation": "8개 배타 귀속·이력 확인", "policy": "취소 후 입고는 취소 고객에 재배분 금지"}, {"id": "S-03", "name": "역할 및 권한", "group": "설정", "fields": ["역할", "재고 조정 위임", "민감 승인 업무"], "actions": ["위임 설정", "승인"], "validation": "직원 스스로 권한 상승 금지", "policy": "점주 승인과 직원 요청 분리"}];let current='O-01';const nav=document.getElementById('nav'),main=document.getElementById('main');function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function showToast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',3300)}function render(id){current=id;const s=screens.find(x=>x.id===id);nav.innerHTML=screens.map(x=>`<button class="${x.id===id?'active':''}" data-id="${x.id}">${esc(x.name)}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>render(b.dataset.id));let inner='';if(id==='O-01'){inner=`<div class="grid">${[['신규 주문','12'],['발주 대기','8'],['입고 배분','5'],['환급 필요','2']].map(x=>`<div class="metric">${x[0]}<b>${x[1]}건</b></div>`).join('')}</div>`}if(['O-02','O-06','R-01'].includes(id)){inner=`<div class="card"><div class="controls"><input placeholder="번호·고객·도서 검색"><select><option>전체 상태</option><option>처리 필요</option><option>완료</option></select><button class="secondary" onclick="showToast('필터 시연 화면입니다')">검색</button></div><table class="table" style="margin-top:20px"><thead><tr><th>번호</th><th>대상</th><th>수량</th><th>상태</th><th>작업</th></tr></thead><tbody>${[1,2,3].map(i=>`<tr><td>2026-00012${i}</td><td>예시 도서 ${i}</td><td>${i}권</td><td><span class="tag">처리 필요</span></td><td><button class="secondary" onclick="render('O-04')">상세</button></td></tr>`).join('')}</tbody></table></div>`}if(id==='O-04'){inner=`<div class="grid">${[['주문 수량','3권'],['확보','2권'],['인도','1권'],['결제 잔액','15,000원']].map(x=>`<div class="metric">${x[0]}<b>${x[1]}</b></div>`).join('')}</div>`}inner+=`<div class="card"><h2>${esc(s.name)} · 입력 및 정보 구조</h2><div class="fieldgrid">${s.fields.map((f,i)=>`<div class="field"><label>${esc(f)} ${i<2?'*':''}</label><input placeholder="${esc(f)} 입력·선택" /></div>`).join('')}</div><div class="notice"><b>업무 규칙</b><div>${esc(s.policy)}</div></div><div class="actions"><button class="secondary" onclick="showToast('와이어프레임 시연: 저장하지 않았습니다')">취소</button>${s.actions.map((a,i)=>`<button class="${i===s.actions.length-1?'primary':'secondary'}" onclick="showToast('화면 시연입니다. 실제 업무 데이터는 저장되지 않습니다.')">${esc(a)}</button>`).join('')}</div></div><div class="card"><h2>검증·오류 처리</h2><p>${esc(s.validation)}</p><p class="muted small">실제 처리에서는 서버의 테넌트·권한·수량·버전·중복 명령 검증이 필요합니다.</p></div>`;main.innerHTML=`<div class="head"><div><h1>${esc(s.name)}</h1><p class="subtitle">${esc(s.id)} · ${esc(s.group)} · 웹 P0 핵심 와이어프레임</p></div><span class="tag">인터랙티브 시안 · 데이터 저장 없음</span></div>${inner}<p class="help">※ 색상·배치·입력 필드는 UI 설계 제안입니다. 정책과 실제 기능 구현은 SFS/OPDS를 기준으로 합니다.</p>`}render(current);
</script></body></html>
